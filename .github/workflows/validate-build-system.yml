name: Validate image build system
on:
  push:
    branches: [main]
  pull_request:
    paths: ['build.sh', 'VERSION', 'scripts/**', 'vpsctl/**', 'configs/**', 'packages/**', 'tests/**', 'docs/**', '.github/workflows/validate-build-system.yml']
  workflow_dispatch:
    inputs:
      build_and_boot:
        description: 'Build and boot the candidate (required for publication)'
        type: boolean
        default: false
      online_tests:
        description: 'Also test NTP sync, Docker Hub, HTTP and reboot'
        type: boolean
        default: true
      upload_image:
        description: 'Save the tested QCOW2 and signed bundle as a 7-day downloadable artifact'
        type: boolean
        default: true
      publish_release:
        description: 'Publish after all tests (development versions are prereleases; main only)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate publication inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          BUILD_AND_BOOT: ${{ inputs.build_and_boot }}
          ONLINE_TESTS: ${{ inputs.online_tests }}
        run: |
          if [[ "$PUBLISH_RELEASE" == true ]]; then
            [[ "$BUILD_AND_BOOT" == true && "$ONLINE_TESTS" == true ]] || { echo 'Publication requires build_and_boot and online_tests' >&2; exit 1; }
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Publication is allowed only from main' >&2; exit 1; }
          fi
      - run: sudo apt-get update && sudo apt-get install -y shellcheck python3-yaml gnupg qemu-utils minisign
      - run: ./tests/static-checks.sh
  build-and-boot:
    if: github.event_name == 'workflow_dispatch' && inputs.build_and_boot
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      image_artifact_id: ${{ steps.upload_image.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write  # Keyless cosign signing via the workflow OIDC token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Prepare build cache
        id: cache_context
        run: |
          mkdir -p .ci-cache/apt/partial .ci-cache/libguestfs
          echo "image=${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore host packages and libguestfs appliance
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-cache/
          key: image-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_context.outputs.image }}-${{ steps.cache_context.outputs.date }}
          restore-keys: |
            image-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cache_context.outputs.image }}-
      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$GITHUB_WORKSPACE/.ci-cache/apt" -o APT::Keep-Downloaded-Packages=true install -y mmdebstrap libguestfs-tools qemu-utils qemu-system-x86 ovmf cloud-image-utils busybox-static gnupg python3-yaml dosfstools e2fsprogs shellcheck dpkg-dev build-essential
      - name: Install Rust MSRV
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Restore vpsctl build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            vpsctl/target/
          key: image-vpsctl-${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-${{ hashFiles('vpsctl/Cargo.lock') }}
      - name: Build and validate source-bound vpsctl package
        run: |
          cargo +1.99.0 fmt --manifest-path vpsctl/Cargo.toml --all -- --check
          cargo +1.99.0 clippy --manifest-path vpsctl/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo +1.99.0 test --manifest-path vpsctl/Cargo.toml --locked --all-targets
          cargo +1.99.0 build --manifest-path vpsctl/Cargo.toml --locked
          python3 vpsctl/tests/tui_pty.py
          ./vpsctl/scripts/package-deb.sh
          python3 vpsctl/tests/package_deb.py
          python3 scripts/vpsctl_package.py --source . --json
      - name: Build development candidate
        run: |
          sudo chown -R root:root .ci-cache/libguestfs
          sudo env LIBGUESTFS_CACHEDIR="$GITHUB_WORKSPACE/.ci-cache/libguestfs" ./build.sh
      - name: Boot two disposable instances with disk-growth test
        run: |
          image=$(find output -maxdepth 2 -name "vps-linux-v$(cat VERSION).qcow2" -type f -print -quit)
          test -n "$image"
          bundle=$(dirname "$image")
          args=(--accel auto)
          if [[ "${{ inputs.online_tests }}" == true ]]; then args+=(--release-check); fi
          ./tests/smoke-test.sh "$image" "${args[@]}"
          ./scripts/verify-release.sh "$bundle"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums (keyless)
        run: |
          bundle=$(dirname "$(find output -maxdepth 2 -name "vps-linux-v$(cat VERSION).qcow2" -type f -print -quit)")
          mkdir -p artifacts
          cp "$bundle/SHA256SUMS" "$bundle/sbom.spdx.json" "$bundle/build.json" "$bundle/packages.tsv" artifacts/
          cosign sign-blob --yes \
            --bundle artifacts/SHA256SUMS.sigstore.json \
            artifacts/SHA256SUMS
          cosign verify-blob artifacts/SHA256SUMS \
            --bundle artifacts/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp '^https://github\.com/rxzsu/vps-linux/\.github/workflows/validate-build-system\.yml@refs/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
          cp artifacts/SHA256SUMS artifacts/tampered-checksums
          chmod u+w artifacts/tampered-checksums
          printf '\n' >> artifacts/tampered-checksums
          if cosign verify-blob artifacts/tampered-checksums \
            --bundle artifacts/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp '^https://github\.com/rxzsu/vps-linux/\.github/workflows/validate-build-system\.yml@refs/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'; then
            echo 'ERROR: keyless verification accepted changed manifest bytes' >&2
            exit 1
          fi
          rm artifacts/tampered-checksums
      - name: Stage successfully tested image bundle
        if: success() && (inputs.upload_image || inputs.publish_release)
        run: |
          image=$(find output -maxdepth 2 -name "vps-linux-v$(cat VERSION).qcow2" -type f -print -quit)
          test -n "$image"
          bundle=$(dirname "$image")
          mkdir -p ci-artifacts
          cp "$bundle"/vpsctl_*.deb ci-artifacts/
          cp "$image" "$image.sha256" "$bundle/build.json" "$bundle/packages.tsv" \
            "$bundle/sbom.spdx.json" "$bundle/SHA256SUMS" \
            artifacts/SHA256SUMS.sigstore.json ci-artifacts/
      - name: Upload tested QCOW2 bundle
        id: upload_image
        if: success() && (inputs.upload_image || inputs.publish_release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vps-linux-tested-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Make build cache readable for saving
        if: always()
        run: |
          if [[ -d .ci-cache && ! -L .ci-cache ]]; then
            sudo chown -R "$(id -u):$(id -g)" .ci-cache
          fi
      - name: Retain metadata, SBOM and signature (no private keys)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vps-linux-build-metadata-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/**
            output/*/build.json
            output/*/packages.tsv
            output/*/sbom.spdx.json
            output/*/SHA256SUMS
            output/*/*.sha256
            output/smoke-failure-*/*.log
            smoke-diagnostics/**/*.log
          if-no-files-found: ignore

  publish:
    name: Publish verified tag and release
    needs: build-and-boot
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.build_and_boot && inputs.online_tests && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: vps-linux-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-and-boot.outputs.image_artifact_id }}
          path: downloaded-bundle
          digest-mismatch: error
      - run: sudo apt-get update && sudo apt-get install -y qemu-utils
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify artifact, create immutable tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-ci-release.py downloaded-bundle
