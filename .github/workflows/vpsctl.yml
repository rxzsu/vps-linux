name: Validate vpsctl
on:
  push:
    paths: ['vpsctl/**', '.github/workflows/vpsctl.yml']
  pull_request:
    paths: ['vpsctl/**', '.github/workflows/vpsctl.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: vpsctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install exact MSRV
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            vpsctl/target/
          key: vpsctl-${{ runner.os }}-${{ runner.arch }}-rust-1.99.0-${{ hashFiles('vpsctl/Cargo.lock') }}
      - name: Install cargo-deny
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2 (cargo-deny)
        with:
          tool: cargo-deny
      - name: Dependency advisories, licenses, bans and sources
        run: cargo +1.99.0 deny --locked check advisories bans licenses sources
      - name: Format
        run: cargo +1.99.0 fmt --all -- --check
      - name: Clippy
        run: cargo +1.99.0 clippy --locked --all-targets --all-features -- -D warnings
      - name: Unit and CLI tests
        run: cargo +1.99.0 test --locked --all-targets
      - name: TUI terminal restoration tests
        run: |
          cargo +1.99.0 build --locked
          python3 tests/tui_pty.py
      - name: Release build on MSRV
        run: cargo +1.99.0 build --locked --release
      - name: Build Debian package and check payload
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev shellcheck
          python3 -m unittest discover -s tests -p 'test_*.py'
          shellcheck scripts/package-deb.sh
          ./scripts/package-deb.sh
          python3 tests/package_deb.py
      - name: Upload Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vpsctl-amd64-deb
          path: vpsctl/dist/*.deb
          if-no-files-found: error
          retention-days: 7
