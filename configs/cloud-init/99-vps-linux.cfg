#cloud-config
# Only NoCloud is supported and tested; other datasources are not validated.
datasource_list: [NoCloud]
preserve_hostname: false
manage_etc_hosts: true
ssh_pwauth: false
disable_root: true
ssh_deletekeys: true
ssh_genkeytypes: [ed25519, ecdsa]
# Grow the root partition and filesystem when the virtual disk is larger than the image.
growpart:
  mode: auto
  devices: ['/']
  ignore_growroot_disabled: false
resize_rootfs: true
# networkd owns the single DHCP configuration; cloud-init will not create ifupdown files.
network:
  config: disabled
users: [default]
system_info:
  default_user:
    name: debian
    gecos: Debian
    groups: [adm, sudo, docker]
    shell: /bin/bash
    lock_passwd: true
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
