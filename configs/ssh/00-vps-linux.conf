# OpenSSH uses the first value encountered: precede cloud-init's 50-* file.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
# Brute-force and idle-connection limits for an Internet-facing VPS.
LoginGraceTime 20
MaxAuthTries 3
ClientAliveInterval 300
ClientAliveCountMax 3
RequiredRSASize 3072
