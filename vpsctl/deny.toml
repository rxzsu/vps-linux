# cargo-deny policy for vpsctl. CI runs `cargo deny check --locked advisories bans licenses sources`.
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Transitive dependencies of the read-only CLI; widen only with a recorded reason.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "deny"
skip = [
    # clap_mangen/clap_complete pull syn 3 while derive macros still pin syn 2.
    { crate = "syn", reason = "transitive duplicate across clap and serde derive stacks" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
